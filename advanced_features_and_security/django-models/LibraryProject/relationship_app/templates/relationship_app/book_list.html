{% extends 'base.html' %}

{% block content %}
<h1>Book List</h1>

<form method="get">
    <input type="text" name="q" placeholder="Search by title" value="{{ request.GET.q }}">
    <button type="submit">Search</button>
</form>

<ul>
    {% for book in books %}
    <li>{{ book.title }} by {{ book.author }} ({{ book.publication_year }})</li>
    {% empty %}
    <li>No books found.</li>
    {% endfor %}
</ul>
{% endblock %}
